#------------------------------------------------------------
# Values for this lesson.
#------------------------------------------------------------

# Which carpentry is this (swc, dc, lc, or cp)? < REPLACED with UNIMELB institutes >
# uom: University of Melbourne
# mb: Melbourne Bioinformatics
# mig: Melbourne Integrative Genomics
# wehi: Walter and Eliza Hall Institute
# abacbs: Australian Bioinformatics and Computational Biology Society
carpentry: 'uom'

# Alt-text description of the lesson.
carpentry_description: 'In-depth statistical analysis of taxonomic and functional profiling output from nf-core pipelines (Day 1)'

# Overall title for pages.
title: 'WGS Metagenomics - Statistical Analysis of Taxonomic and Functional profiles'

# Date the lesson was created ('YYYY-MM-DD', this is empty by default)
created: ~ # FIXME

# Comma-separated list of keywords for the lesson. Avoid words in the title.
keywords: 'taxonomy database, alpha-diversity, beta-diversity, relative abundance, differential abundance testing'

# Life cycle stage of the lesson
# refer to <https://docs.carpentries.org/resources/curriculum/lesson-life-cycle.html> for details
# possible values: pre-alpha, alpha, beta, stable
life_cycle: 'pre-alpha'

# License of the lesson
license: 'CC-BY 4.0'

# Link to the source repository for this lesson
source: 'https://github.com/melbournebioinformatics/workbench-template-rmd' # FIXME

# Default branch of your lesson
branch: 'main'

# Who to contact if there are any issues
contact: 'fixme@fixme.org' # FIXME

# Navigation ------------------------------------------------
#
# Use the following menu items to specify the order of
# individual pages in each dropdown section. Leave blank to
# include all pages in the folder.
#
# Example -------------
#
# episodes:
# - introduction.md
# - first-steps.md
#
# learners:
