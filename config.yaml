# Order of episodes in your lesson
episodes:
- 01-recap.Rmd
- 02-profilers-concepts.Rmd
- 03-community-analysis.Rmd
- 04-differential-abundance.Rmd
- 05-wrap-up.Rmd

# Information for Learners
learners:

# Information for Instructors
instructors:

# Learner Profiles
profiles:

